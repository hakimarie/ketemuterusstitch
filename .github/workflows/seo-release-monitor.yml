name: KetemuTerus SEO release monitor

on:
  schedule:
    # 13:00 Asia/Jakarta (UTC+7)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run production-only monitor
        run: python scripts/seo_release_monitor.py
      - name: Persist monitor state
        run: |
          if ! git diff --quiet -- seo-monitor-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo-monitor-state.json
            git commit -m "chore: update SEO release monitor state"
            git push origin HEAD:main
          fi
